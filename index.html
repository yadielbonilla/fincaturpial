<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finca Turpial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Copperplate:wght@400;700&family=Baloo+2:wght@700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="promo-bar">
      <button class="promo-arrow" aria-label="Previous offer">&lsaquo;</button>
      <span>Free Standard Shipping for Orders Over $200. <span class="promo-link">→</span></span>
      <button class="promo-arrow" aria-label="Next offer">&rsaquo;</button>
    </div>

    <header class="site-header">
      <div class="top-row">
        <div class="brand-wrap" aria-label="Finca Turpial home page">
          <div class="brand-mark">
            <span class="brand-circle">F</span>
          </div>
          <div class="brand-text">
            <h1>Finca Turpial</h1>
            <span>Selected Seeds</span>
          </div>
        </div>

        <div class="header-tools">
          <a href="#" class="account-link">Sign In / Create Account</a>

          <div class="search-wrap">
            <input type="text" aria-label="Search Finca Turpial" placeholder="Search Finca Turpial" />
            <button aria-label="Search">⌕</button>
          </div>

          <button class="cart-button" aria-label="Shopping cart">
            <span class="cart-icon">🛒</span>
            <span class="cart-count">0</span>
          </button>
        </div>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="fruits.html">FRUITS</a>
        <a href="vegetables.html">VEGETABLES</a>
        <a href="dragonfruit-plants.html">DRAGONFRUIT PLANTS</a>
        <a href="other-consumables.html">OTHER CONSUMABLES</a>
        <a href="about.html">ABOUT</a>
      </nav>
    </header>

    <main class="hero-section">
      <div class="hero-card">
        <h2>Recently Added</h2>
        <p>Browse new products you might have missed</p>
        <button class="shop-button">SHOP NOW</button>
      </div>

      <div class="slider-controls" aria-label="Slider controls">
        <button class="control-button" aria-label="Previous slide">&lsaquo;</button>
        <button class="control-button pause" aria-label="Pause slider">II</button>
        <button class="control-button" aria-label="Next slide">&rsaquo;</button>
      </div>
    </main>

    <div class="admin-note">
      <strong>Authorized admin contacts:</strong>
      <span id="admin-list"></span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
